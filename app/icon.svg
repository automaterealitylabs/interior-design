<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#161412"/>
  <!-- Stylized "L" monogram — two architectural lines forming an L shape -->
  <!-- Vertical stroke -->
  <rect x="170" y="100" width="28" height="292" rx="2" fill="#C9A574"/>
  <!-- Horizontal stroke -->
  <rect x="170" y="364" width="200" height="28" rx="2" fill="#C9A574"/>
  <!-- Accent thin line — diagonal architectural detail -->
  <line x1="198" y1="364" x2="310" y2="310" stroke="#C9A574" stroke-width="3" opacity="0.5"/>
</svg>
